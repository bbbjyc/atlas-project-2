<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 집 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ── 테마 토큰: 애완모드(기본) / 전쟁모드(.war) ── */
.room{
  --safe-t:max(14px,env(safe-area-inset-top));
  --safe-b:max(18px,env(safe-area-inset-bottom));
  --wall-1:#fdf3e7; --wall-2:#f6e1ca; --dot:rgba(214,160,110,.16);
  --base:#ebcfac; --floor-1:#e0b287; --floor-2:#cc976a; --seam:rgba(120,70,35,.13);
  --rug-1:#ffd3df; --rug-2:#ffb3c7;
  --glass:rgba(255,255,255,.84); --glass-line:rgba(255,255,255,.95);
  --ink:#3a2d4f; --ink-2:#8c81a5; --track:#eee8f7;
  --accent:#ff6f9f; --accent-2:#ff9a76; --primary:#7c6cf6;
  --shadow:0 6px 18px rgba(92,60,40,.13),0 1px 3px rgba(92,60,40,.08);
  --sheet:#fffaf5; --card:#fff; --chip-bg:#f3edf8;
}
.room.war{
  --wall-1:#3b3055; --wall-2:#281f3d; --dot:rgba(255,255,255,.05);
  --base:#1f1830; --floor-1:#2e2540; --floor-2:#1f192d; --seam:rgba(0,0,0,.28);
  --rug-1:#8a2940; --rug-2:#b8425a;
  --glass:rgba(34,26,52,.8); --glass-line:rgba(255,255,255,.1);
  --ink:#fff; --ink-2:#b3a8cf; --track:rgba(255,255,255,.12);
  --accent:#ff5d6c; --accent-2:#ff9f4a; --primary:#ff5d6c;
  --shadow:0 8px 22px rgba(0,0,0,.35);
  --sheet:#231b35; --card:#2f2647; --chip-bg:rgba(255,255,255,.08);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1c1629;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── 방 ── */
.room{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;color:var(--ink);isolation:isolate}
.wall{position:absolute;inset:0 0 38% 0;background:radial-gradient(var(--dot) 1.6px,transparent 1.9px) 0 0/22px 22px,linear-gradient(var(--wall-1),var(--wall-2))}
.floor{position:absolute;inset:62% 0 0 0;background:
  repeating-linear-gradient(90deg,transparent 0 70px,var(--seam) 70px 72px),
  repeating-linear-gradient(0deg,transparent 0 44px,var(--seam) 44px 46px),
  linear-gradient(var(--floor-1),var(--floor-2))}
.floor::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px;background:var(--base)}
.floor::after{content:"";position:absolute;left:0;right:0;top:0;height:48px;background:linear-gradient(rgba(0,0,0,.1),transparent)}
.room::after{content:"";position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
.room.flash::after{animation:flash .45s ease-out}
@keyframes flash{30%{opacity:.35}}

.decor{position:absolute;z-index:1;filter:drop-shadow(0 4px 6px rgba(60,35,20,.12))}
.window{left:57%;top:15%;width:132px;transform:translateX(-50%)}
.frame{left:9%;top:34%;width:66px}
.lamp{left:4%;bottom:33%;width:46px}
.plant{right:5%;bottom:32%;width:60px}
.rug{position:absolute;z-index:1;left:50%;bottom:calc(29% - 26px);width:250px;transform:translateX(-50%)}
.rug .r1{fill:var(--rug-1)} .rug .r2{stroke:var(--rug-2)}

/* 장식 색 (SVG 안) */
.sky1{stop-color:#bfe4ff} .sky2{stop-color:#eef8ff}
.war .sky1{stop-color:#1c2152} .war .sky2{stop-color:#3d2c6b}
.wood{fill:#fff} .war .wood{fill:#4a3d63}
.curtain{fill:#ffb3c7} .war .curtain{fill:#7d2436}
.metal{fill:#c9a27a} .war .metal{fill:#5b4d73}
.shade{fill:#fff4dc} .war .shade{fill:#ff9f6b}
.leaf{fill:#7cc58b} .war .leaf{fill:#44604d}
.pot{fill:#f3a07a} .war .pot{fill:#57466e}
.room .night{display:none} .room.war .night{display:inline} .room.war .day{display:none}

/* ── 캐릭터 ── */
.char-wrap{position:absolute;z-index:2;left:50%;bottom:29%;width:168px;transform:translateX(-50%);cursor:pointer}
.char{display:block;width:100%;height:auto;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-2px) scaleY(1.012)}}
.char-wrap.hop .char{animation:hop .5s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{30%{transform:translateY(-18px) scaleY(1.03)}65%{transform:translateY(0) scaleY(.95)}100%{transform:none}}
.eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.hood1{stop-color:#a495ff} .hood2{stop-color:#7361ef} .collar{fill:#5f4fdc}
.war .hood1{stop-color:#636a8c} .war .hood2{stop-color:#3d4260} .war .collar{fill:#2f3350}

/* ── HUD 공통 ── */
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2)}
.hud{position:absolute;z-index:5}

/* 왼쪽 위: 프로필 + 스탯 */
.profile{left:12px;top:var(--safe-t);height:44px;max-width:calc(50% - 76px);display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:22px}
.avatar{position:relative;flex:none;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffe1ec,#e4dcff)}
.avatar svg{width:100%;height:100%;border-radius:50%}
.lvb{position:absolute;right:-5px;bottom:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.who{min-width:0;line-height:1.25}
.who b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:11px;color:var(--ink-2);font-weight:600}
.stats{left:12px;top:calc(var(--safe-t) + 52px);width:138px;padding:12px;border-radius:18px}
.xp-top{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.xp-top b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stats ul{list-style:none;margin-top:12px;display:grid;gap:8px}
.stats li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-weight:600}
.stats li b{margin-left:auto;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.chip{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.chip svg.i{width:14px;height:14px;stroke-width:2.3}
.c-love{background:#ffe3ea;color:#ff5d86} .c-pow{background:#ece7ff;color:#6f5cf0}
.c-def{background:#e3eeff;color:#3d6fe0} .c-hp{background:#ffe1e1;color:#e5484d}
/* 전쟁모드: 체력 바, 물약 효과 */
.stats li.hp{position:relative;padding-bottom:7px;white-space:nowrap}
.stats li.hp small{font-size:10px;font-weight:700;color:var(--ink-2)}
.stats li.hp .track{position:absolute;left:30px;right:0;bottom:0;height:4px}
.stats li.hp .track i{background:linear-gradient(90deg,#ff5d6c,#ff9f4a)}
.buffs{flex-wrap:wrap;gap:4px;margin-top:9px}
.buffs:empty{display:none!important}
.buff{padding:2px 6px;border-radius:7px;font-size:10px;font-weight:800;white-space:nowrap}
.b-atk{background:rgba(255,93,108,.18);color:#ff8791} .b-def{background:rgba(93,140,255,.2);color:#8fb2ff} .b-regen{background:rgba(46,196,166,.2);color:#5fd3b5}
.c-cash{background:#fff0d2;color:#e0950e} .c-link{background:#dbf4ee;color:#1ea88b}
.war .chip{background:rgba(255,255,255,.08)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 가운데 위: 모드 전환 */
.mode{left:50%;top:var(--safe-t);transform:translateX(-50%);width:120px;height:44px;padding:4px;border-radius:22px;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.mode:active{transform:translateX(-50%) scale(.96)}
.thumb{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:34px;border-radius:17px;background:linear-gradient(135deg,#9585ff,#6c5cf0);box-shadow:0 3px 8px rgba(108,92,240,.35);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.war .thumb{transform:translateX(100%);background:linear-gradient(135deg,#ff7a6b,#e8434f);box-shadow:0 3px 10px rgba(232,67,79,.45)}
.opt{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink-2);transition:color .3s}
.opt svg.i{width:14px;height:14px}
.room:not(.war) .opt-pet,.war .opt-war{color:#fff}

/* 오른쪽 위: 상점 / 미션 */
.side-r{right:12px;top:var(--safe-t);display:flex;flex-direction:column;gap:10px}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700}
.disc{position:relative;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;transition:transform .15s}
.disc svg.i{width:22px;height:22px}
button:active .disc{transform:scale(.92)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}

/* 아래: 설정 / 돌봄 독 / 친구 초대 */
.settings{left:12px;bottom:var(--safe-b)}
.invite{right:12px;bottom:var(--safe-b)}
.invite .disc{width:56px;height:56px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 8px 18px rgba(255,111,159,.45)}
.dock{left:50%;bottom:var(--safe-b);transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px}
.act{width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border-radius:18px;transition:background .2s}
.act:active{background:rgba(0,0,0,.05)}
.act:active .ico{transform:scale(.92)}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;transition:transform .15s}
.act small{font-size:11px;font-weight:700}
.act em{font-style:normal;font-size:10px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:2px}
.act em svg.i{width:11px;height:11px;stroke-width:2.4;color:#e0950e}
.ico.feed{background:#ffe9d8;color:#f07a2a} .ico.clean{background:#e6f6e9;color:#2fa860} .ico.shower{background:#e3efff;color:#3f7cf0}
.ico.duel{background:rgba(255,93,108,.18);color:#ff8791} .ico.clan{background:rgba(255,159,74,.18);color:#ffb36e}
.room:not(.war) .war-only{display:none} .room.war .war-only{display:flex} .room.war .pet-only{display:none}

/* 피드백 */
.toast{position:absolute;z-index:40;left:50%;top:36%;transform:translate(-50%,-8px);padding:10px 16px;border-radius:14px;background:rgba(30,22,45,.9);color:#fff;font-size:13px;font-weight:600;width:max-content;max-width:calc(100% - 32px);text-align:center;text-wrap:balance;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.float{position:absolute;z-index:8;left:50%;bottom:calc(29% + 210px);font-size:15px;font-weight:800;white-space:nowrap;pointer-events:none;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 0 rgba(255,255,255,.8)}
.war .float{text-shadow:0 2px 4px rgba(0,0,0,.6)}
/* ── 상점 (아이콘에서 튀어나오는 90% 창) ── */
.scrim{position:absolute;inset:0;z-index:30;background:rgba(14,9,24,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:31;left:5%;top:5%;width:90%;height:90%;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:var(--sheet);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35);opacity:0;transform:scale(.06);pointer-events:none;transition:transform .42s cubic-bezier(.2,.9,.25,1.04),opacity .22s}
.sheet.on{opacity:1;transform:none;pointer-events:auto}
.sheet-head{display:flex;align-items:center;gap:8px;padding:18px 16px 14px 20px}
.sheet-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.wallet{margin-left:auto;display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:17px;background:var(--chip-bg);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.wallet svg.i{width:16px;height:16px;color:#e0950e}
.close{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--chip-bg)}
.close svg.i{width:18px;height:18px}
/* 상점 머리의 충전 버튼 (제목과 지갑 사이 가운데) */
.topup-btn{margin:0 auto;display:flex;align-items:center;gap:4px;height:34px;padding:0 13px 0 10px;border-radius:17px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:13px;font-weight:800;box-shadow:0 4px 10px rgba(255,111,159,.3);transition:transform .12s}
.topup-btn svg.i{width:15px;height:15px;stroke-width:2.8}
.topup-btn:active{transform:scale(.95)}
.topup-btn + .wallet{margin-left:0}
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:0 16px;padding:4px;border-radius:16px;background:var(--chip-bg)}
.tab-thumb{position:absolute;top:4px;left:4px;width:calc((100% - 8px)/3);height:38px;border-radius:12px;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.tab{position:relative;height:38px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2);transition:color .25s}
.tab svg.i{width:16px;height:16px}
.tab[aria-selected="true"]{color:var(--ink)}
.grid{flex:1;overflow-y:auto;padding:16px 16px 24px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start;grid-auto-rows:max-content}
.grid[data-cat="clothes"]{--ph-bg:#efeaff}
.grid[data-cat="deco"]{--ph-bg:#ffeedf}
.grid[data-cat="food"]{--ph-bg:#e4f6e9}
.war .grid{--ph-bg:rgba(255,255,255,.06)}
.item{display:flex;flex-direction:column;border-radius:18px;background:var(--card);box-shadow:0 2px 10px rgba(60,40,80,.08);overflow:hidden;animation:pop .3s both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.ph{position:relative;overflow:hidden;aspect-ratio:1/.8;display:grid;place-items:center;background:var(--ph-bg)}
.art{width:60%;height:auto;fill:none;stroke:#7b4a3a;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;overflow:visible}
.item-body{flex:1;display:flex;flex-direction:column;padding:10px 12px 12px}
.item-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.price svg.i{width:14px;height:14px;color:#e0950e}
.buy{height:30px;padding:0 12px;border-radius:10px;background:var(--primary);color:#fff;font-size:12px;font-weight:800;transition:transform .12s}
.buy:active{transform:scale(.94)}
.buy[disabled]{background:var(--chip-bg);color:var(--ink-2);cursor:default}
.item-stat{display:flex;align-items:center;gap:3px;margin-top:3px;font-size:11px;font-weight:700;color:var(--ink-2)}
.item-stat svg.i{flex:none;width:12px;height:12px}
.item-stat.gear{flex-wrap:wrap;gap:2px 8px}
.item-stat.gear span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.item-fx{display:flex;gap:4px;margin-top:6px;padding:5px 7px;border-radius:9px;background:linear-gradient(135deg,rgba(255,111,159,.12),rgba(124,108,246,.12));color:var(--accent);font-size:10.5px;font-weight:700;line-height:1.35}
.item-fx svg.i{flex:none;width:12px;height:12px;margin-top:1px}
.grid[data-cat="weapon"]{--ph-bg:rgba(255,93,108,.13)}
.grid[data-cat="armor"]{--ph-bg:rgba(93,140,255,.15)}
.grid[data-cat="potion"]{--ph-bg:rgba(170,110,255,.16)}
/* 등급 탭: 일반 / 희귀 / 전설(프리미엄 포함) */
.gfilter{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 16px 0}
.gchip{height:32px;border-radius:11px;background:var(--chip-bg);font-size:13px;font-weight:800;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.gchip small{margin-left:4px;font-size:10px;font-weight:700;opacity:.75}
.gchip[aria-pressed="true"]{color:#fff}
.gc-n[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.gc-r[aria-pressed="true"]{background:#3d82f0}
.gc-l[aria-pressed="true"]{background:linear-gradient(135deg,#ffd23f,#ff9f2e);color:#ffe94d;text-shadow:var(--legend-outline);box-shadow:0 4px 12px rgba(255,160,40,.35)}
/* 등급별 이름 색: 일반 검정(기본) / 희귀 파랑 / 전설 노랑 + 얇은 빨간 테두리 */
.room{--legend-outline:-.6px -.6px 0 #d42a2a,.6px -.6px 0 #d42a2a,-.6px .6px 0 #d42a2a,.6px .6px 0 #d42a2a,0 -.75px 0 #d42a2a,0 .75px 0 #d42a2a,-.75px 0 0 #d42a2a,.75px 0 0 #d42a2a}
.g-r .item-name{color:#2f74e8}
.war .g-r .item-name{color:#7fb0ff}
.g-l .item-name,.g-p .item-name{color:#ffd21f;font-weight:900;text-shadow:var(--legend-outline)}
/* 등급 뱃지·카드 */
.grade{position:absolute;z-index:1;top:8px;left:8px;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.85);color:#8c81a5;font-size:10px;font-weight:800}
.g-r{box-shadow:0 0 0 2px #8db8ff,0 4px 12px rgba(61,139,255,.15)}
.g-r .grade{background:#e3eeff;color:#2f74e8}
.g-l .ph{background:radial-gradient(circle at 50% 45%,#fff3c9,#ffe2a6)}
.g-l .grade{background:linear-gradient(135deg,#ffd76a,#ff9f2e);color:#fff}
.g-p .ph{background:radial-gradient(circle at 50% 45%,#fff6d6,#ffd9ec 60%,#e6dcff)}
.g-p .grade{background:linear-gradient(135deg,#ffb52e,var(--accent) 55%,var(--primary));color:#fff}
.g-p .buy:not([disabled]){background:linear-gradient(135deg,var(--accent),var(--primary))}
.g-p .price{color:var(--accent)}
/* 전설·전설(프리미엄): 카드가 은은하게 빛나고, 그림 위로 빛줄기가 지나간다 */
.g-l{animation:pop .3s both,glowL 2.4s ease-in-out .3s infinite}
.g-p{animation:pop .3s both,glowP 2s ease-in-out .3s infinite}
@keyframes glowL{0%,100%{box-shadow:0 0 0 2px #ffc24a,0 4px 12px rgba(255,170,40,.2)}50%{box-shadow:0 0 0 2px #ffd36a,0 0 20px rgba(255,190,40,.6)}}
@keyframes glowP{0%,100%{box-shadow:0 0 0 2px #ff9fc4,0 0 0 4px rgba(255,194,74,.5),0 6px 16px rgba(255,111,159,.25)}50%{box-shadow:0 0 0 2px #ffc24a,0 0 0 4px rgba(255,111,159,.45),0 0 26px rgba(255,111,159,.6)}}
.g-l .ph::after,.g-p .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);transform:translateX(-130%);animation:shine 3.2s ease-in-out infinite}
.g-p .ph::after{animation-duration:2.4s}
@keyframes shine{55%,100%{transform:translateX(130%)}}
@media (prefers-reduced-motion:reduce){
  .g-l{animation:pop .3s both;box-shadow:0 0 0 2px #ffc24a,0 0 16px rgba(255,190,40,.45)}
  .g-p{animation:pop .3s both;box-shadow:0 0 0 2px #ffc24a,0 0 0 4px rgba(255,111,159,.45),0 0 20px rgba(255,111,159,.5)}
  .g-l .ph::after,.g-p .ph::after{display:none}
}
/* ── 캐릭터 꾸미기 ── */
.edit-hint{position:absolute;right:4px;top:30%;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--primary);pointer-events:none}
.edit-hint svg.i{width:15px;height:15px;stroke-width:2.3}
.free{font-size:11px;font-weight:800;color:#1ea88b;background:#dbf4ee;padding:5px 9px;border-radius:9px}
.war .free{background:rgba(30,168,139,.18);color:#5fd3b5}
.push{margin-left:auto}
.preview{position:relative;flex:none;height:32%;margin:0 16px;border-radius:20px;background:radial-gradient(ellipse 42% 9% at 50% 90%,var(--rug-1) 0 98%,transparent 100%),var(--chip-bg);display:grid;place-items:center;overflow:hidden}
.preview svg{height:94%;width:auto;margin-top:4%}
.dice{position:absolute;right:10px;top:10px;height:30px;padding:0 10px;border-radius:10px;background:var(--card);font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.dice svg.i{width:15px;height:15px}
.ctabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin:12px 16px 0;padding:4px;border-radius:14px;background:var(--chip-bg)}
.ctab{height:34px;border-radius:10px;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
.ctab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.opts{flex:1;overflow-y:auto;padding:14px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;grid-auto-rows:max-content}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 6px 8px;border-radius:16px;background:var(--card);border:2px solid transparent;box-shadow:0 2px 8px rgba(60,40,80,.07);font-size:12px;font-weight:700;color:var(--ink-2);animation:pop .25s both}
.tile[aria-pressed="true"]{border-color:var(--primary);color:var(--ink)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--sheet)}
.fp{width:100%;aspect-ratio:1.3;border-radius:11px;background:var(--chip-bg);display:grid;place-items:center;overflow:hidden}
.fp svg{width:100%;height:100%}
.sw{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.65),0 2px 6px rgba(0,0,0,.15)}
.sheet-foot{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--chip-bg)}
.sheet-foot button{flex:1;height:46px;border-radius:14px;font-size:15px;font-weight:800;transition:transform .12s}
.sheet-foot button:active{transform:scale(.97)}
.btn-ghost{background:var(--chip-bg);color:var(--ink)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(124,108,246,.3)}
/* ── 미션 ── */
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:0 16px;padding:4px;border-radius:14px;background:var(--chip-bg)}
.tier-tab{position:relative;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink-2);transition:background .2s,color .2s}
.tier-tab small{font-size:10px;font-weight:600}
.tier-tab svg.i{position:absolute;top:5px;left:6px;width:11px;height:11px}
.tier-tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tier-tab.locked{opacity:.55}
.tier-tab.has::after{content:"";position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tier-head{flex:none;margin:12px 16px 0;padding:14px 14px 12px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#9585ff,#6c5cf0);box-shadow:0 6px 16px rgba(108,92,240,.25)}
.war .tier-head{background:linear-gradient(135deg,#ff7a6b,#c8364a);box-shadow:0 6px 16px rgba(200,54,74,.3)}
.tier-head h3{font-size:16px;font-weight:800}
.tier-head p{font-size:12px;opacity:.85;margin-top:2px}
.tier-prog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;font-weight:800}
.tier-prog .track{flex:1;background:rgba(255,255,255,.25)}
.tier-prog .track i{background:#fff}
.bonus{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;font-weight:600}
.bonus svg.i{width:15px;height:15px}
.bonus button{margin-left:auto;height:30px;padding:0 12px;border-radius:10px;background:#fff;color:#6c5cf0;font-size:12px;font-weight:800}
.war .bonus button{color:#c8364a}
.bonus button[disabled]{background:rgba(255,255,255,.22);color:#fff;cursor:default}
.mlist{flex:1;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.mission{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);box-shadow:0 2px 8px rgba(60,40,80,.07);animation:pop .25s both}
.mission.done{opacity:.55}
.mission.soon{opacity:.6;border:1.5px dashed var(--ink-2);box-shadow:none}
.mlist.locked .mission{filter:grayscale(1);opacity:.5}
.m-ico{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--chip-bg);color:var(--primary)}
.m-body{flex:1;min-width:0}
.m-title{font-size:14px;font-weight:800}
.m-desc{font-size:11px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-prog{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.m-prog .track{flex:1;height:5px}
.m-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rewards{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.reward{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;white-space:nowrap}
.reward svg.i{width:13px;height:13px;color:#e0950e}
.reward.ritem{font-size:11px;color:var(--accent)}
.reward.ritem svg.i{color:var(--accent)}
.claim{height:28px;min-width:58px;padding:0 10px;border-radius:9px;background:var(--primary);color:#fff;font-size:12px;font-weight:800;transition:transform .12s}
.claim:active{transform:scale(.94)}
.claim[disabled]{background:var(--chip-bg);color:var(--ink-2);cursor:default}
.locked-note{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--chip-bg);font-size:12px;font-weight:700;color:var(--ink-2)}
.locked-note svg.i{width:16px;height:16px;flex:none}
/* ── 충전 팝업 (페이크 도어. 어떤 화면 위에도 뜬다) ── */
.topup{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding:20px;background:rgba(14,9,24,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.topup.on{opacity:1;pointer-events:auto}
.topup-card{width:100%;max-height:100%;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--sheet);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35);transform:translateY(18px) scale(.96);transition:transform .32s cubic-bezier(.2,.9,.25,1.04)}
.topup.on .topup-card{transform:none}
.topup-body{overflow-y:auto;padding:2px 16px 18px;display:flex;flex-direction:column;gap:8px}
.short-note{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:10px 12px;border-radius:14px;background:#fff0d2;color:#b8740a;font-size:13px;font-weight:700}
.short-note svg.i{width:16px;height:16px;flex:none}
.short-note b{font-weight:900}
.war .short-note{background:rgba(255,159,74,.15);color:#ffb36e}
.topup-label{margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.pack{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:16px;background:var(--card);box-shadow:0 2px 8px rgba(60,40,80,.07);text-align:left;transition:transform .12s;animation:pop .25s both}
.pack:active{transform:scale(.98)}
.pack .coin{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff0d2;color:#e0950e}
.war .pack .coin,.war .done-ico{background:rgba(255,183,77,.16);color:#ffb74d}
.pack-amt{flex:1;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.pack-price{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.was{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)}
.off{padding:1px 6px;border-radius:6px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;font-style:normal}
.won{height:30px;padding:0 12px;border-radius:10px;display:flex;align-items:center;background:var(--primary);color:#fff;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.pack.best{margin-top:6px;padding:18px 14px 16px;box-shadow:0 0 0 2px var(--primary),0 8px 18px rgba(124,108,246,.22)}
.pack.best::before{content:"추천";position:absolute;top:-10px;left:14px;padding:2px 9px;border-radius:8px;background:var(--primary);color:#fff;font-size:11px;font-weight:800}
.pack.best .pack-amt{font-size:19px}
.pack.best .coin{width:44px;height:44px}
.topup-done{padding:30px 22px 22px;text-align:center}
.done-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;background:#fff0d2;color:#e0950e}
.done-ico svg.i{width:28px;height:28px}
.topup-done h3{font-size:18px;font-weight:800}
.topup-done p{margin-top:6px;font-size:13px;color:var(--ink-2)}
.topup-done button{width:100%;height:46px;margin-top:20px;border-radius:14px;font-size:15px;font-weight:800}
.badge[hidden]{display:none}
.badge.ping{animation:ping .5s}
@keyframes ping{50%{transform:scale(1.4)}}



@keyframes floatUp{from{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.05)}to{opacity:0;transform:translate(-50%,-60px)}}
</style>
</head>

const $ = id => document.getElementById(id);
const room = $('room');

function render() {
  const lv = Math.floor(state.cares / 10), xp = state.cares % 10;
  $('lv').textContent = $('lvBadge').textContent = lv;
  $('xpTxt').textContent = `${xp} / 10`;
  $('xpBar').style.width = xp * 10 + '%';
  // 애정 = 기본 + 입은 옷 중 최고 + 가진 가구 (애완 아이템은 여기까지만)
  $('love').textContent = state.love + outfitLove() + decoLove();
  // 전투력·방어력 = 레벨·기본 애정 + 전투 장비, 그다음 물약 % 적용
  const { weapon, armor } = equipped();
  const atk = lv * 10 + state.love + (weapon?.[3] || 0) + (armor?.[3] || 0);
  const def = lv * 5 + (weapon?.[4] || 0) + (armor?.[4] || 0);
  $('power').textContent = Math.round(atk * (1 + buffPct('atk') / 100));
  $('def').textContent = Math.round(def * (1 + buffPct('def') / 100));
  $('hpTxt').innerHTML = `${state.hp}<small>/${maxHp()}</small>`;
  $('hpBar').style.width = state.hp / maxHp() * 100 + '%';
  $('buffs').innerHTML = buffs.map(b => `<span class="buff b-${b.k}">${
    { atk: `전투력 +${b.a}%`, def: `방어력 +${b.a}%`, regen: `재생 +${b.a}` }[b.k]} · ${b.t}${b.k === 'regen' ? '턴' : '판'}</span>`).join('');
  $('cash').textContent = state.cash.toLocaleString();
  $('depth').textContent = `${state.depth}단계`;
}

const toastQ = [];
let toastBusy = false;
function toast(msg) {
  if (toastQ.length < 3) toastQ.push(msg);
  if (!toastBusy) nextToast();
}
function nextToast() {
  const t = $('toast'), msg = toastQ.shift();
  if (!msg) { toastBusy = false; return; }
  toastBusy = true;
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => { t.classList.remove('on'); setTimeout(nextToast, 250); }, 1300);
}

function float(text, color, delay = 0) {
  setTimeout(() => {
    const f = document.createElement('div');
    f.className = 'float'; f.textContent = text; f.style.color = color;
    room.appendChild(f); setTimeout(() => f.remove(), 1000);
  }, delay);
}

function hop() {
  const p = $('pet'); p.classList.remove('hop'); void p.offsetWidth; p.classList.add('hop');
}

function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

document.querySelectorAll('[data-msg]').forEach(b => b.onclick = () => toast(b.dataset.msg));

document.querySelectorAll('[data-care]').forEach(b => b.onclick = () => {
  if (state.cash < COST) {
    retrigger($('cashRow'), 'shake');
    openTopup(COST, b.dataset.care);
    return;
  }
  const before = Math.floor(state.cares / 10);
  state.cash -= COST; state.cares++;
  stats[b.dataset.care]++;
  render(); hop();
  float(`${b.dataset.label}! +1 EXP`, '#7c6cf6');
  float(`-${COST}`, '#e0950e', 180);
  if (Math.floor(state.cares / 10) > before) toast(`레벨 업! Lv.${before + 1}`);
  checkMissions();
});


$('mode').onclick = () => {
  state.war = !state.war;

};

  return rules;
}, { list: [], pending: [] }).list]));

function itemArt(cat, kind, it) {
  const [name, g] = it;
  const arch = ART_RULES[cat].find(([re]) => re.test(name))[1];
  let a, b;
  if (kind === 'potion') { a = FX_COLOR[it[3][0][0]]; b = FX_COLOR[it[3][1]?.[0]]; }
  else {
    const word = g === 'n' ? it[kind === 'gear' ? 5 : 4] : Object.keys(ART_COLOR).find(k => name.includes(k));
    a = ART_COLOR[word] || (TINT[word] && `color-mix(in srgb,${TINT[word]} 72%,#fff)`);
  }
  if (g === 'l') b ||= '#ffd84d';
  if (g === 'p') b ||= '#ffb3e6';
  const style = [a && `--a:${a}`, b && `--b:${b}`].filter(Boolean).join(';');
  const f = g === 'l' || g === 'p' ? FACE[arch] : null;
  return `<svg class="art" viewBox="0 0 64 64"${style ? ` style="${style}"` : ''}><use href="#a-${arch}"/>${
    f ? `<use href="#o-face" transform="translate(${f[0]} ${f[1]}) scale(${f[2]})"/>` : ''}${g === 'n' ? '' : `<use href="#o-${g}"/>`}</svg>`;
}

// 지금 마시면 달라지는 게 있는 효과인지 (체력이 가득이면 회복은 헛일, 더 약한 효과는 덮어쓰지 못한다)
const fxUseful = ([k, a, t]) => {
  if (k === 'heal') return state.hp < maxHp();
  const cur = curBuff(k);
  return !cur || a > cur.a || (a === cur.a && t > cur.t);
};

let regenTimer = null;   // 재생 효과가 걸려 있는 동안에만 돈다
function drinkPotion(name, effects) {
  const used = effects.filter(fxUseful);
  for (const [k, a, t] of used) {
    if (k === 'heal') { state.hp = Math.min(maxHp(), state.hp + a); continue; }
    const cur = curBuff(k);
    if (cur) Object.assign(cur, { a, t }); else buffs.push({ k, a, t });
    if (k === 'regen' && !regenTimer) regenTimer = setInterval(tickRegen, 1000);
  }
  toast(`${name}! ${used.map(fxText).join(', ')}`);   // 상점 창에 가려지는 float 대신 toast
}
function tickRegen() {
  const b = curBuff('regen');
  if (b) { state.hp = Math.min(maxHp(), state.hp + b.a); if (--b.t <= 0) buffs.splice(buffs.indexOf(b), 1); }
  if (!curBuff('regen')) { clearInterval(regenTimer); regenTimer = null; }
  render();
}

function statHTML(kind, it, statIcon, statName) {
  const line = (icon, text) => `<div class="item-stat"><svg class="i"><use href="#${icon}"/></svg>${text}</div>`;
  if (kind === 'gear') {
    const [, , , atk, def] = it;
    return `<div class="item-stat gear">${atk ? `<span><svg class="i"><use href="#i-sword"/></svg>전투력 +${atk}</span>` : ''}${
      def ? `<span><svg class="i"><use href="#i-shield"/></svg>방어력 +${def}</span>` : ''}</div>`;
  }
  if (kind === 'potion') return it[3].map(f => line(FX_ICON[f[0]], fxText(f))).join('');
  return line(statIcon, `${statName} +${it[3]}`);
}

function renderShop() {
  const set = curShop(), keys = Object.keys(set);
  if (!set[shopCat]) shopCat = keys[0];
  const { stat, kind, items } = set[shopCat];
  const [statIcon, statName] = STAT[stat] || [];
  const grid = $('shopGrid');
  grid.dataset.cat = shopCat;
  // 모드에 따라 탭 이름이 바뀐다 (애완: 옷·집 꾸미기·음식 / 전쟁: 무기·갑옷·물약)
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.dataset.cat = keys[i];
    t.innerHTML = `<svg class="i"><use href="#${set[keys[i]].icon}"/></svg>${set[keys[i]].label}`;
    t.setAttribute('aria-selected', keys[i] === shopCat);
  });
  $('tabThumb').style.transform = `translateX(${keys.indexOf(shopCat) * 100}%)`;
  // 등급별로 나눠 보기. 전설 탭에는 전설(프리미엄)이 맨 앞에 같이 나온다
  const match = (sel, g) => g === sel || (sel === 'l' && g === 'p');
  $('gfilter').innerHTML = [['n', '일반'], ['r', '희귀'], ['l', '전설']].map(([sel, label]) =>
    `<button class="gchip gc-${sel}" data-g="${sel}" aria-pressed="${sel === shopGrade}">${label}<small>${items.filter(it => match(sel, it[1])).length}</small></button>`).join('');
  const shown = items.filter(it => match(shopGrade, it[1])).sort((a, b) => (b[1] === 'p') - (a[1] === 'p'));
  grid.innerHTML = shown.map((it, i) => {
    const [name, g, price] = it;
    const fx = kind === 'gear' ? it[6] : kind === 'potion' ? it[4] : null;
    return `<article class="item g-${g}" style="animation-delay:${Math.min(i, 12) * 30}ms">
      <div class="ph"><span class="grade">${GRADE[g]}</span>${itemArt(shopCat, kind, it)}</div>
      <div class="item-body">
        <div class="item-name">${name}</div>
        ${statHTML(kind, it, statIcon, statName)}
        ${fx ? `<div class="item-fx"><svg class="i"><use href="#i-star"/></svg><span>${fx}</span></div>` : ''}
        <div class="item-row">
          <span class="price">${g === 'p' ? won(price) : `<svg class="i"><use href="#i-coin"/></svg>${price.toLocaleString()}`}</span>
          <button class="buy" data-name="${name}"></button>
        </div>
      </div>
    </article>`;
  }).join('');
  syncShop();
}

// 구매 버튼 글자(구매·결제·보유·장착 중)와 지갑만 맞춘다. 구매 뒤에는 이것만 불러서 카드를 다시 그리지 않는다
function syncShop() {
  const eq = equipped();
  $('shopGrid').querySelectorAll('.buy').forEach(b => {
    const { kind, it } = ITEM[b.dataset.name];
    b.disabled = !consumable(kind) && owned.has(it[0]);
    b.textContent = eq.weapon === it || eq.armor === it ? '장착 중' : b.disabled ? '보유' : it[1] === 'p' ? '결제' : '구매';
    b.setAttribute('aria-label', `${it[0]} ${b.textContent}`);
  });
  $('walletAmt').textContent = state.cash.toLocaleString();
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  if (t.dataset.cat === shopCat) return;
  shopCat = t.dataset.cat; renderShop(); $('shopGrid').scrollTop = 0;
});

$('gfilter').onclick = e => {
  const c = e.target.closest('.gchip');
  if (!c || c.dataset.g === shopGrade) return;
  shopGrade = c.dataset.g; renderShop(); $('shopGrid').scrollTop = 0;
};

$('shopGrid').onclick = e => {
  const b = e.target.closest('.buy');
  if (!b || b.disabled) return;
  const { cat, kind, it } = ITEM[b.dataset.name];
  const [name, g, price] = it;
  // 프리미엄은 캐시로 못 사고 직접 결제 → 지금은 페이크 도어
  if (g === 'p') { openSoon(`premium:${name}`); return; }
  // 지금 마셔도 달라지는 게 없는 물약은 캐시를 쓰기 전에 막는다
  if (kind === 'potion' && !it[3].some(fxUseful)) {
    toast(it[3][0][0] === 'heal' ? '체력이 이미 가득 차 있어요' : '이미 같거나 더 강한 효과가 걸려 있어요');
    return;
  }
  if (state.cash < price) {
    retrigger($('wallet'), 'shake');
    openTopup(price, 'buy_item');
    return;
  }
  state.cash -= price;
  stats.buy++;
  if (cat === 'clothes') stats.buyClothes++;
  // 상점 창이 방을 가리고 있어서 결과는 float가 아니라 toast로 알린다
  if (cat === 'food') {
    const before = Math.floor(state.cares / 10);
    state.cares += it[3];
    toast(`${name} 냠냠! 경험치 +${it[3]}`);
    if (Math.floor(state.cares / 10) > before) toast(`레벨 업! Lv.${Math.floor(state.cares / 10)}`);
  } else if (kind === 'potion') {
    drinkPotion(name, it[3]);
  } else {
    owned.add(name);
    const eq = equipped();
    if (kind === 'gear') toast(eq[cat] === it ? `${name} 장착! 전투력 +${it[3]} · 방어력 +${it[4]}` : `${name} 구매 완료! (더 좋은 장비를 장착 중)`);
    else toast(`${name} 구매 완료! 애정 +${it[3]}`);
  }
  render(); syncShop();
  checkMissions();
};

let openSheetEl = null;
function openSheet(sheet, originEl) {
  const r = room.getBoundingClientRect();
  const b = originEl.getBoundingClientRect();
  const x = b.left + b.width / 2 - r.left - r.width * 0.05;
  const y = b.top + b.height / 2 - r.top - r.height * 0.05;
  sheet.style.transformOrigin = `${x}px ${y}px`;
  // 뒤쪽 아이콘은 터치·클릭·키보드 모두 막는다
  [...room.children].forEach(el => { if (el !== sheet && !['scrim', 'toast'].includes(el.id)) el.inert = true; });
  $('scrim').classList.add('on');
  sheet.classList.add('on');
  sheet.setAttribute('aria-hidden', 'false');
  openSheetEl = sheet;
}
function closeSheet() {
  const sheet = openSheetEl;
  if (!sheet) return;
  $('scrim').classList.remove('on');
  sheet.classList.remove('on');
  sheet.setAttribute('aria-hidden', 'true');
  [...room.children].forEach(el => el.inert = false);
  openSheetEl = null;
}

const TOPUP = [[100, 100], [200, 190], [500, 450], [1000, 880], [2000, 1700], [4000, 3200], [10000, 7500]];
const fakeDoorLogs = [];   // 나중에 fakeDoor.ts(fake_door_logs 저장) 호출로 교체
function logFakeDoor(event_type, tier, shortage_reason) {
  const row = { event_type, tier, shortage_reason };
  fakeDoorLogs.push(row);
  console.log('fake_door_logs', row);
}
const won = n => `${n.toLocaleString()}원`;
let topupCtx = null, topupInerted = [], topupOpener = null;

function packHTML([amt, price], i, best) {
  const off = Math.round((1 - price / amt) * 100);
  return `<button class="pack${best ? ' best' : ''}" data-amt="${amt}" style="animation-delay:${i * 30}ms">
    <span class="coin"><svg class="i"><use href="#i-coin"/></svg></span>
    <span class="pack-amt">${amt.toLocaleString()} 캐시</span>
    <span class="pack-price">${off ? `<span class="was"><em class="off">-${off}%</em><s>${won(amt)}</s></span>` : ''}<span class="won">${won(price)}</span></span>
  </button>`;
}

function renderTopup() {
  const short = topupCtx.need - state.cash;
  let body;
  if (short > 0) {
    // 부족한 만큼을 딱 채우는 가장 작은 상품을 추천, 그보다 큰 상품은 아래에
    let b = TOPUP.findIndex(([amt]) => amt >= short);
    if (b < 0) b = TOPUP.length - 1;
    const more = TOPUP.slice(b + 1);
    body = `<p class="short-note"><svg class="i"><use href="#i-coin"/></svg><span>캐시가 <b>${short.toLocaleString()}</b> 부족해요</span></p>
      ${packHTML(TOPUP[b], 0, true)}
      ${more.length ? `<p class="topup-label">더 많이 충전하고 더 할인받기</p>${more.map((p, i) => packHTML(p, i + 1)).join('')}` : ''}`;
  } else {
    body = TOPUP.map((p, i) => packHTML(p, i)).join('');
  }
  $('topupCard').innerHTML = `<header class="sheet-head">
      <h2 id="topupTitle">캐시 충전</h2>
      <div class="wallet"><svg class="i"><use href="#i-coin"/></svg><span>${state.cash.toLocaleString()}</span></div>
      <button class="close" data-topup-close aria-label="닫기"><svg class="i"><use href="#i-close"/></svg></button>
    </header>
    <div class="topup-body">${body}</div>`;
}

// 뒤쪽(열려 있는 상점 포함)은 막고, 닫을 때 막았던 것만 다시 푼다. 키보드 포커스는 팝업 안으로 옮겼다가 닫을 때 돌려준다
function showTopupLayer() {
  topupOpener = document.activeElement;
  topupInerted = [...room.children].filter(el => !['topup', 'toast'].includes(el.id) && !el.inert);
  topupInerted.forEach(el => el.inert = true);
  $('topup').classList.add('on');
  $('topup').setAttribute('aria-hidden', 'false');
  $('topup').inert = false;
  $('topupCard').querySelector('button').focus({ preventScroll: true });
}
// need: 하려던 행동의 비용(직접 열면 0), reason: shortage_reason (feed / clean / shower / buy_item ...)
// shortage_reason은 schema.sql에서 NOT NULL이라, 상점에서 직접 연 경우도 buy_item으로 남긴다
function openTopup(need = 0, reason = 'buy_item') {
  topupCtx = { need, reason };
  renderTopup();
  showTopupLayer();
  logFakeDoor('popup_shown', null, reason);
}
function closeTopup() {
  if (!topupCtx) return;
  $('topup').classList.remove('on');
  $('topup').setAttribute('aria-hidden', 'true');
  $('topup').inert = true;   // 닫힌 팝업 속 버튼에 Tab으로 들어가지 않게
  topupInerted.forEach(el => el.inert = false);
  topupInerted = [];
  topupCtx = null;
  if (topupOpener?.isConnected) topupOpener.focus({ preventScroll: true });
}

const claimed = new Set(), bonusClaimed = new Set(), notified = new Set();
let missionTier = 1, missionSeen = false;

const findMission = id => MISSION_TIERS.flatMap(t => t.missions).find(m => m.id === id);
const progress = m => Math.min(m.goal, m.get());
const isDone = m => progress(m) >= m.goal;
const tierUnlocked = lv => lv === 1 || bonusClaimed.has(lv - 1);
const tierAllClaimed = t => t.missions.every(m => m.soon || claimed.has(m.id));
const tierClaimable = t => tierUnlocked(t.lv) &&
  (t.missions.filter(m => isDone(m) && !claimed.has(m.id)).length + (tierAllClaimed(t) && !bonusClaimed.has(t.lv) ? 1 : 0));

function rewardHTML(r) {
  return `<div class="rewards">${r.cash ? `<span class="reward"><svg class="i"><use href="#i-coin"/></svg>${r.cash}</span>` : ''}${
    r.item ? `<span class="reward ritem"><svg class="i"><use href="#i-gift"/></svg>${r.item}</span>` : ''}</div>`;
}

function renderMissions() {
  $('mWalletAmt').textContent = state.cash.toLocaleString();
  $('tiers').innerHTML = MISSION_TIERS.map(t => {
    const open = tierUnlocked(t.lv);
    return `<button class="tier-tab${open ? '' : ' locked'}${tierClaimable(t) ? ' has' : ''}" role="tab" data-lv="${t.lv}" aria-selected="${t.lv === missionTier}">${
      open ? '' : '<svg class="i"><use href="#i-lock"/></svg>'}Lv.${t.lv}<small>${t.name}</small></button>`;
  }).join('');

  const t = MISSION_TIERS[missionTier - 1], open = tierUnlocked(t.lv);
  const real = t.missions.filter(m => !m.soon), doneN = real.filter(m => claimed.has(m.id)).length;
  const canBonus = doneN === real.length && !bonusClaimed.has(t.lv);
  $('tierHead').innerHTML = `<h3>Lv.${t.lv} ${t.title}</h3><p>${t.desc}</p>
    <div class="tier-prog"><div class="track"><i style="width:${doneN / real.length * 100}%"></i></div>${doneN} / ${real.length}</div>
    <div class="bonus"><svg class="i"><use href="#i-star"/></svg>모두 완료 보너스 <b>+${t.bonus}</b>${t.lv < MISSION_TIERS.length ? ' · 다음 단계 열림' : ''}
      <button id="bonusBtn" ${canBonus ? '' : 'disabled'}>${bonusClaimed.has(t.lv) ? '받음' : '받기'}</button></div>`;

  const order = m => m.soon ? 3 : claimed.has(m.id) ? 2 : isDone(m) ? 0 : 1;   // 받을 수 있는 것 → 진행 중 → 완료 순
  const list = [...t.missions].sort((a, b) => order(a) - order(b));
  $('mlist').className = 'mlist' + (open ? '' : ' locked');
  $('mlist').innerHTML = (open ? '' : `<div class="locked-note"><svg class="i"><use href="#i-lock"/></svg>Lv.${t.lv - 1} 미션을 모두 끝내고 보너스를 받으면 열려요</div>`) +
    list.map((m, i) => {
      const p = progress(m), c = claimed.has(m.id), d = p >= m.goal;
      if (m.soon) return `<article class="mission soon" style="animation-delay:${i * 30}ms">
        <span class="m-ico"><svg class="i"><use href="#${m.icon}"/></svg></span>
        <div class="m-body"><div class="m-title">${m.title}</div><div class="m-desc">${m.desc}</div></div>
        <div class="m-side">${rewardHTML(m.reward)}<button class="claim" disabled>준비 중</button></div></article>`;
      return `<article class="mission${c ? ' done' : ''}" style="animation-delay:${i * 30}ms">
        <span class="m-ico"><svg class="i"><use href="#${m.icon}"/></svg></span>
        <div class="m-body"><div class="m-title">${m.title}</div><div class="m-desc">${m.desc}</div>
          <div class="m-prog"><div class="track"><i style="width:${p / m.goal * 100}%"></i></div>${p} / ${m.goal}</div></div>
        <div class="m-side">${rewardHTML(m.reward)}<button class="claim" data-id="${m.id}" ${open && d && !c ? '' : 'disabled'}>${c ? '완료' : d ? '받기' : '진행 중'}</button></div>
      </article>`;
    }).join('');
}

function grant(r) {
  if (r.cash) state.cash += r.cash;
  if (r.item) owned.add(r.item);   // 상점에서 '보유'로 표시된다
  render();
  toast(`보상: ${[r.cash && `${r.cash} 캐시`, r.item].filter(Boolean).join(' + ')}`);
}

function updateMissionBadge() {
  const b = $('missionBadge');
  const n = MISSION_TIERS.reduce((sum, t) => sum + tierClaimable(t), 0);
  const text = n ? String(n) : missionSeen ? '' : '!';
  if (text && text !== b.textContent) retrigger(b, 'ping');
  b.textContent = text;
  b.hidden = !text;
}

// 행동 뒤에 불러서 새로 끝난 미션을 알려 준다
function checkMissions() {
  MISSION_TIERS.forEach(t => {
    if (!tierUnlocked(t.lv)) return;
    t.missions.forEach(m => {
      if (isDone(m) && !claimed.has(m.id) && !notified.has(m.id)) { notified.add(m.id); toast(`미션 완료! ${m.title}`); }
    });
  });
  updateMissionBadge();
}

$('tiers').onclick = e => {
  const b = e.target.closest('.tier-tab');
  if (b && +b.dataset.lv !== missionTier) { missionTier = +b.dataset.lv; renderMissions(); $('mlist').scrollTop = 0; }
};
$('mlist').onclick = e => {
  const b = e.target.closest('.claim');
  if (!b || b.disabled) return;
  const m = findMission(b.dataset.id);
  claimed.add(m.id);
  grant(m.reward);
  renderMissions(); updateMissionBadge();
};
$('tierHead').onclick = e => {
  const b = e.target.closest('#bonusBtn');
  if (!b || b.disabled) return;
  const t = MISSION_TIERS[missionTier - 1];
  bonusClaimed.add(t.lv);
  grant({ cash: t.bonus });
  if (t.lv < MISSION_TIERS.length) { missionTier = t.lv + 1; toast(`Lv.${t.lv + 1} ${MISSION_TIERS[t.lv].name} 미션이 열렸어요!`); }
  renderMissions(); checkMissions();
};

function openMissions() {
  missionSeen = true;
  // 아직 끝나지 않은 가장 낮은 단계를 먼저 보여 준다
  const cur = MISSION_TIERS.find(t => tierUnlocked(t.lv) && !bonusClaimed.has(t.lv));
  missionTier = (cur || MISSION_TIERS[MISSION_TIERS.length - 1]).lv;
  renderMissions();
  openSheet($('missions'), $('missionBtn').querySelector('.disc'));
  updateMissionBadge();
}

function openShop() { renderShop(); openSheet($('shop'), $('shopBtn').querySelector('.disc')); stats.shopOpen++; checkMissions(); }
function openCustom() { draft = { ...charCfg }; customTab = 'gender'; renderCustom(); openSheet($('custom'), $('pet')); }

$('shopBtn').onclick = openShop;
$('missionBtn').onclick = openMissions;
$('pet').onclick = () => { hop(); openCustom(); };
$('scrim').onclick = closeSheet;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') topupCtx ? closeTopup() : closeSheet(); });
drawCharacter();
// 개발용: home.html#shop / #custom 으로 바로 열기
if (location.hash === '#shop') openShop();
if (location.hash === '#custom') openCustom();
if (location.hash === '#missions') openMissions();
if (location.hash === '#topup') openTopup();

render();
updateMissionBadge();
</script>
</body>
</html>
